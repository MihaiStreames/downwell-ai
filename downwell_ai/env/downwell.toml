# hazards fixed to the terrain, exported as their own grid channel so a row of spikes never fills the hazard slots
[terrain_hazards]
objSpike_n = { id = 97 }
spikeTrap  = { id = 102 }
coralSpike = { id = 298 }

# reasons to leave the straight way down; category is health, charge, module, gem_source, side_room or shop
# an entry with a parent is not exported itself, the exporter's with() on the parent already covers its instances
[pickups]
Heal1                 = { id = 251, category = "health" }                                # heart from a gun module or a 25 combo
TomatoObtainable      = { id = 252, category = "health" }                                # +10 hp in the abyss side room
BatteryCharge         = { id = 250, category = "charge" }                                # +max charge from a gun module or a 15 combo
GunModule             = { id = 109, category = "module" }                                # new weapon plus a heart and a battery
objObtainableUg       = { id = 283, category = "module" }
objObtainableUgRandom = { id = 286, category = "module", parent = "objObtainableUg" }
Crate                 = { id = 254, category = "module" }                                # the gun module container in safe zones
objGemSphere          = { id = 292, category = "gem_source" }                            # gem vein in safe zones, ~120 gems
gemChunk              = { id = 293, category = "gem_source" }                            # colored gem block
parentTimeField       = { id = 82, category = "side_room" }                              # never placed itself, exporting it covers both bubbles
goalTimeField         = { id = 255, category = "side_room", parent = "parentTimeField" } # the time void bubble around a safe zone
startTimeField        = { id = 371, category = "side_room", parent = "goalTimeField" }
Shop                  = { id = 277, category = "shop" }                                  # the counter, jumping next to it starts a purchase
shopCase              = { id = 279, category = "shop" }                                  # the item cases behind the shopkeeper

# kept objects outside every table above, exported because the agent should see them
[extras]
objCurrency = { id = 248 } # a loose gem
objDrone    = { id = 249 } # the drone upgrade, shoots for the player
