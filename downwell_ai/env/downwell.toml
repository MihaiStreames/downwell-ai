# downwell objects the agent knows about, read by downwell_ai/env/_game_data.py and scripts/gen_export.py
# keys are the game's object names, ids its object indices in data.win
# identified from data.win sprite names, the decompiled code and the downwell wiki

[upgrades]
# position is the id the game uses (scrUpgrades), names from its language.ini
# dumbbell, super charge and sudden fortune are never offered
names = [
  "blast module",
  "reverse engineering",
  "dumbbell",
  "rest in pieces",
  "gem powered",
  "gunpowder blocks",
  "youth",
  "candle",
  "hot casing",
  "drone",
  "gem attractor",
  "knife and fork",
  "laser sight",
  "apple",
  "member's card",
  "heart balloon",
  "popping gems",
  "timeout",
  "rocket jump",
  "super charge",
  "gem sick",
  "sudden fortune",
  "safety jetpack",
]

