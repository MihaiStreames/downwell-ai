fail_fast: true

repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        priority: 0
      - id: end-of-file-fixer
        priority: 0
      - id: mixed-line-ending
        args: [--fix=lf]
        priority: 0

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        priority: 0
        args: [--fix, --unsafe-fixes]
      - id: ruff-format
        priority: 0

  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: v2.29.4
    hooks:
      - id: pyproject-fmt
        priority: 0

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: "0.26"
    hooks:
      - id: validate-pyproject
        priority: 1

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        priority: 1

  - repo: local
    hooks:
      - id: typing
        name: ty
        entry: uvx ty check
        language: system
        types: [python]
        pass_filenames: false
        priority: 0

      - id: tests
        name: pytest
        entry: uv run pytest
        language: system
        types: [python]
        pass_filenames: false
        priority: 0

      - id: toml-format
        name: taplo
        entry: uvx taplo fmt
        language: system
        types: [toml]
        priority: 0

      - id: sorting
        name: ssort
        entry: uvx ssort
        language: system
        types: [python]
        exclude: /generated/
        priority: 0
