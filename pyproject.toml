[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "downwell-ai"
version = "2.0.0"
description = "DQN agent for Downwell."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "gymnasium>=1.3.0",
  "loguru>=0.7.3",
  "matplotlib>=3.11.2",
  "msgspec>=0.22.0",
  "numpy>=2.5.3",
  "pillow>=12.3.0",
  "pymemoryeditor>=3.0.1",
  "rich>=15.0.0",
  "torch>=2.14.1",
  "typer>=0.27.2",
]
[project.scripts]
downwell-train = "downwell_ai.cli:app"
downwell-play = "downwell_ai.cli:play_app"
downwell-plot = "downwell_ai.cli:plot_app"

[dependency-groups]
dev = [ "pytest>=9.1.1", "ruff>=0.16.10", "ssort>=0.17.0", "ty>=0.0.84" ]

[tool.hatch.build.targets.wheel]
packages = [ "downwell_ai" ]

[tool.uv]
python-preference = "only-managed"
exclude-newer = "7 days"
[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.ruff]
target-version = "py313"
line-length = 160
src = [ ".", "./tests" ]
extend-exclude = [ "**/generated/**" ]  # written by scripts/gen_*.py, checked by the generated hook instead
[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-line-length = 160
docstring-code-format = true
[tool.ruff.lint.per-file-ignores]
"scripts/**" = [ "ALL" ]
"tests/**" = [
  "ANN201",  # missing-return-type-undocumented-public-function
  "D100",    # undocumented-public-module (no need for these in tests)
  "D103",    # undocumented-public-function (same)
  "INP001",  # implicit-namespace-package (if tests become a package, remove)
  "PLR2004", # magic-value-comparison (expected values read clearer inline)
  "S101",    # assert (idiomatic in pytest)
  "T201",    # print (fine in test output)
]
[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true
lines-after-imports = 2
section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "local-folder",
]
[tool.ruff.lint.pydocstyle]
convention = "numpy"
[tool.ruff.lint.pylint]
max-args = 7
max-branches = 20
max-returns = 6
max-statements = 60
[tool.ruff.lint]
select = [ "ALL" ]
ignore = [
  "COM812", # missing-trailing-comma (formatter conflict)
  "CPY001", # missing-copyright-notice (the license lives in LICENSE, not per-file headers)
  "D100",   # undocumented-public-module (no module docstrings for now)
  "D104",   # undocumented-public-package (no module docstrings for now)
  "ERA001", # commented-out-code (leave for now)
  "FIX002", # line-contains-todo
  "INP001", # implicit-namespace-package (no module docstrings for now)
  "RUF012", # mutable-default-value (what is this?)
  "TD003",  # missing-todo-link (TODOs aren't tied to issues (yet))
]
fixable = [ "ALL" ]
unfixable = []

[tool.pyproject-fmt]
column_width = 120
indent = 2
keep_full_version = true
generate_python_version_classifiers = true
table_format = "long"

[tool.ty.environment]
root = [ "." ]
python-version = "3.13"
[tool.ty.rules]
possibly-unresolved-reference = "warn"
unresolved-import = "warn"

[tool.pytest.ini_options]
testpaths = [ "tests" ]
pythonpath = [ "." ]
addopts = [ "-m", "not smoke", "--strict-markers" ]
markers = [ "smoke: requires game running; skipped by default" ]
